name: Update balanced multi-source + INCY subscriptions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "filter_openray.py"
      - "filter_multi.py"
      - "build_incy.py"
      - ".github/workflows/update.yml"
  schedule:
    # Refresh twice per hour; sources themselves update on their own schedules.
    - cron: "12,42 * * * *"

permissions:
  contents: write

concurrency:
  group: update-balanced-multi-vpn
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_url="$({
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest
          } | jq -r '
            .assets[]
            | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$"))
            | .browser_download_url
          ' | head -n 1)"

          if [ -z "${asset_url}" ] || [ "${asset_url}" = "null" ]; then
            echo "Could not find the Mihomo linux-amd64-compatible asset"
            exit 1
          fi

          curl -fL "${asset_url}" -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          sudo mv /tmp/mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Install latest Xray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_url="$({
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/XTLS/Xray-core/releases/latest
          } | jq -r '
            .assets[]
            | select(.name == "Xray-linux-64.zip")
            | .browser_download_url
          ' | head -n 1)"

          if [ -z "${asset_url}" ] || [ "${asset_url}" = "null" ]; then
            echo "Could not find the Xray-linux-64 asset"
            exit 1
          fi

          curl -fL "${asset_url}" -o /tmp/xray.zip
          mkdir -p /tmp/xray-release
          unzip -q /tmp/xray.zip -d /tmp/xray-release
          sudo install -m 0755 /tmp/xray-release/xray /usr/local/bin/xray
          xray version

      - name: Build, health-check, and create INCY subscription
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIHOMO_BIN: /usr/local/bin/mihomo
          XRAY_BIN: /usr/local/bin/xray

          # Keep 10 stable URI candidates; INCY leaves up to 5 compatible nodes.
          MAX_PER_COUNTRY: "10"

          # Test a useful pool from every country/source, not thousands.
          MAX_CANDIDATES_PER_COUNTRY: "60"
          SOURCE_PER_COUNTRY_LIMIT: "80"
          GLOBAL_SOURCE_LINE_LIMIT: "50000"

          CHECK_TIMEOUT_MS: "5000"
          STABILITY_ROUNDS: "3"
          STABILITY_PAUSE_SECONDS: "15"
          STABILITY_CANDIDATES_PER_COUNTRY: "15"
          CHECK_WORKERS: "64"
          CHECK_BATCH_SIZE: "9"
          DOWNLOAD_WORKERS: "16"
          DISCOVERY_WORKERS: "16"

          # Never overwrite a healthy old subscription with an almost-empty run.
          MIN_TOTAL_WORKING: "5"
        run: |
          python filter_multi.py
          python build_incy.py

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            balanced.txt \
            balanced_base64.txt \
            stats.json \
            health_report.json \
            sources.json \
            balanced_incy.json \
            incy_stats.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update health-checked multi-source subscription"
            git push
          fi

